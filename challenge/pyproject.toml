[project]
name = "elo-saude"
version = "0.1.0"
description = "MVP de contrarreferência entre hospital/UPA e Atenção Primária (Challenge CIS-AMFRI)"
authors = [
    {name = "U.IMPACT — Challenge CIS-AMFRI"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pyjwt>=2.9,<3.0",
    "pwdlib[argon2]>=0.2.1,<1.0",
    "cryptography>=43.0,<50.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<10.0",
    "taskipy>=1.12,<2.0; python_version < '4.0'",
]

[tool.poetry]
packages = [{include = "challenge", from = "src"}]

[tool.taskipy.tasks]
run = "uvicorn challenge.app:app --reload --host 0.0.0.0 --port 8000"
test = "pytest -q"
migrate = "alembic upgrade head"
revision = "alembic revision --autogenerate -m"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
